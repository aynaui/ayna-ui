version: 2.1

orbs:
    node: circleci/node@5.2.0

jobs:
    lint_code:
        executor: node/default
        description: Lint code
        steps:
            - checkout
            - node/install-packages
            - run:
                  name: Lint code
                  command: npm run lint:fix
    run_tests:
        executor: node/default
        description: Run tests
        steps:
            - checkout
            - node/install-packages
            - run:
                  name: Run tests
                  command: npm run test
    build:
        executor: node/default
        description: Build
        steps:
            - checkout
            - node/install-packages
            - run:
                  name: Build
                  command: npm run build
    run_release:
        executor: node/default
        description: Run release
        steps:
            - checkout
            - node/install-packages
            - run:
                  name: Set up github credentials
                  command: |
                      git config --global user.email $GITHUB_EMAIL
                      git config --global user.name $GITHUB_USERNAME
            - run:
                  name: Run release
                  command: npm run release
    publish_to_npm:
        executor: node/default
        description: Publish to npm
        steps:
            - checkout
            - node/install-packages
            - run:
                  name: Login to npm
                  command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            - run:
                  name: Publish to npm
                  command: npm publish --access public
                  environment:
                      NPM_TOKEN: $NPM_TOKEN

workflows:
    build_and_test:
        jobs:
            - lint_code
            - run_tests:
                  requires:
                      - lint_code
            - build:
                  requires:
                      - run_tests

    release_and_publish:
        jobs:
            - lint_code:
                  filters:
                      tags:
                          only: /^v.*/
                      branches:
                          ignore: /.*/
            - run_tests:
                  requires:
                      - lint_code
                  filters:
                      tags:
                          only: /^v.*/
                      branches:
                          ignore: /.*/
            - build:
                  requires:
                      - run_tests
                  filters:
                      tags:
                          only: /^v.*/
                      branches:
                          ignore: /.*/
            - publish_to_npm:
                  requires:
                      - build
                  filters:
                      tags:
                          only: /^v.*/
                      branches:
                          ignore: /.*/
